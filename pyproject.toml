[project]
name = "monitoring-system"
version = "0.1.0"
description = "Local stage monitoring: Redis Streams → SQLite → Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "streamlit>=1.28",
]

[project.scripts]
stage-ingest = "monitoring_system.ingest.worker:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["monitoring_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
